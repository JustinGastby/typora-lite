<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A6AF9"/>
      <stop offset="48%" stop-color="#3B9EE0"/>
      <stop offset="100%" stop-color="#2ECDCC"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4F7FF"/>
      <stop offset="100%" stop-color="#D7E4F8"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3E6CF0"/>
      <stop offset="100%" stop-color="#2A8FD4"/>
    </linearGradient>
    <filter id="foldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="10" stdDeviation="6" flood-color="#1a4aa8" flood-opacity="0.18"/>
    </filter>
    <!-- macOS-like squircle; extra inset so Dock visual size matches system icons. -->
    <clipPath id="squircle">
      <rect x="88" y="88" width="848" height="848" rx="190" ry="190"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Paper -->
    <path
      fill="#ffffff"
      d="M332 188
         h300
         l124 124
         v476
         a48 48 0 0 1 -48 48
         H332
         a48 48 0 0 1 -48 -48
         V236
         a48 48 0 0 1 48 -48
         z"
    />

    <!-- Dog-ear -->
    <path
      fill="url(#fold)"
      filter="url(#foldShadow)"
      d="M632 188 l124 124 h-88 a36 36 0 0 1 -36 -36 z"
    />

    <!-- Pen-nib / M mark -->
    <g fill="url(#nib)" transform="translate(512 530)">
      <path d="M-96 -176
               L-96 36
               L-58 36
               L-58 -92
               L0 8
               L58 -92
               L58 36
               L96 36
               L96 -176
               L50 -176
               L0 -86
               L-50 -176
               Z"/>
      <path d="M-44 56 L0 186 L44 56 Z"/>
      <circle cx="0" cy="96" r="15" fill="#ffffff"/>
      <rect x="-3.5" y="110" width="7" height="52" rx="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
